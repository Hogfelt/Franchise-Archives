all><div class="who" style="font-size:16px;margin:10px 0">${leaders.length?leaders.map(x=>esc(x[0])).join(', '):'Inga titlar'}</div><div class="value">${max||'–'}</div></div></div></section><section class="panel" onclick="go('career')" style="cursor:pointer"><div class="row"><h3>HÖGFELTS KARRIÄR</h3><b>❯</b></div><div class="grid">${[['Mål',h.g],['Assist',h.a],['Poäng',h.p]].map(x=>`<div class="record"><div class="value">${x[1]}</div><small>${x[0]}</small></div>`).join('')}</div></section><button class="btn" style="width:100%" onclick="editing=null;go('form')">＋ Registrera ny säsong</button></main>`}function totals(){return seasons.reduce((a,s)=>{for(let k of ['gp','g','a'])a[k]+=Number(s.h[k])||0;a.p=a.g+a.a;return a},{gp:0,g:0,a:0,p:0})}function form(){let s=editing!==null?seasons[editing]:null;let rows=(cat)=>`<section class="section"><h3>TOPP 3 – ${{goals:'MÅL',assists:'ASSIST',points:'POÄNG'}[cat]}</h3>${[0,1,2].map(i=>`<div class="formrow"><span>${i+1}.</span><input name="${cat}_${i}_name" list="players" placeholder="Spelare" value="${esc(s?.[cat]?.[i]?.name||'')}"><input name="${cat}_${i}_value" type="number" min="0" placeholder="Antal" value="${esc(s?.[cat]?.[i]?.value??'')}"></div>`).join('')}</section>`;let names=[...new Set(seasons.flatMap(x=>['goals','assists','points'].flatMap(k=>x[k].map(y=>y.name))))].filter(Boolean);return `${head(editing===null?'Ny säsong':'Redigera säsong')}<main class="wrap"><form id="seasonForm" onsubmit="saveSeason(event)"><div class="panel"><label>Säsong</label><input name="year" required pattern="[0-9]{4}/[0-9]{2}" placeholder="2026/27" value="${esc(s?.year||nextSeason())}"><p class="note">Föreslås automatiskt efter senaste registrerade säsongen.</p></div><datalist id="players">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>${['goals','assists','points'].map(rows).join('<hr class="line">')}<hr class="line"><section class="section"><h3>MARKUS HÖGFELT · GRUNDSERIEN</h3><div class="fieldgrid">${[['gp','Matcher'],['g','Mål'],['a','Assist']].map(([k,l])=>`<div><label>${l}</label><input type="number" min="0" name="h_${k}" value="${esc(s?.h?.[k]??'0')}" oninput="calcPoints()"></div>`).join('')}</div><p class="muted">Poäng: <b id="hpoints">${s?Number(s.h.g)+Number(s.h.a):0}</b> (räknas automatiskt)</p></section><hr class="line"><section class="section"><h3>STANLEY CUP-FINALEN</h3><label>Mästare</label><input name="champ" required placeholder="Vinnande lag" value="${esc(s?.champ||'')}"><label>Finalist</label><input name="runner" required placeholder="Förlorande lag" value="${esc(s?.runner||'')}"><label>Finalseriens resultat (från mästarens perspektiv)</label><div class="grid two"><input value="4" disabled aria-label="Mästarens segrar"><select name="losses">${[0,1,2,3].map(n=>`<option value="${n}" ${Number(s?.losses)===n?'selected':''}>4–${n}</option>`).join('')}</select></div></section><hr class="line"><section class="section"><h3>NEW YORK RANGERS</h3><label>Slutspelsresultat</label><select name="playoffs">${[['miss','Missade slutspel'],['r1','Utslagna i första rundan'],['r2','Utslagna i andra rundan'],['cf','Utslagna i konferensfinal'],['final','Förlorade Stanley Cup-finalen'],['cup','Stanley Cup-mästare']].map(([v,l])=>`<option value="${v}" ${s?.playoffs===v?'selected':''}>${l}</option>`).join('')}</select></section><hr class="line"><section class="section"><h3>SÄSONGENS MINNE</h3><textarea name="memory" placeholder="Ett minne från säsongen (frivilligt)">${esc(s?.memory||'')}</textarea></section><button class="btn" style="width:100%" type="submit">${editing===null?'Slutför säsong':'Spara ändringar'}</button><p class="note">Testversion: sparas på den här enheten. Molnlagring ansluts senare.</p></form></main>`}function calcPoints(){let f=$('#seasonForm');$('#hpoints').textContent=(+f.elements.h_g.value||0)+(+f.elements.h_a.value||0)}function saveSeason(e){e.preventDefault();if(readonly())return;let f=e.target,d=new FormData(f),year=String(d.get('year')).trim();if(!/^\d{4}\/\d{2} function iMedals(){return `${iHead('MEDALJLIGAN')}<main class="wrap"><section class="panel"><h2>MEDALJER GENOM TIDERNA</h2>${table(['Landslag','Guld','Silver','Brons'],medalCounts().map(x=>[`${flag(x.n.code)} ${x.n.name}`,x.g,x.s,x.b]))}</section></main>`}
function iFinals(){return `${iHead('FINALHISTORIK')}<main class="wrap"><section class="panel"><h2>ALLA FINALER</h2>${finished().slice().reverse().map(t=>{let f=t.matches[14];return `<button class="irow" onclick="openTournament('${t.id}')"><span><b>${esc(t.year)} · ${esc(t.name)}</b><br>${nation(f.winner)} – ${nation(f.a===f.winner?f.b:f.a)} (${f.winner===f.a?f.score:'2–'+(f.score==='2–0'?'0':'1')})<br><small>Visa hela slutspelsträdet</small></span><b>❯</b></button>`}).join('')||'<p class="note">Inga färdigspelade finaler ännu.</p>'}</section></main>`}
function iNations(){let count=intl.nations.filter(n=>n.active).length;let ordered=rankData();return `${iHead('LANDSLAG & SEEDNING')}<main class="wrap"><section class="panel"><h2>AKTIVA LANDSLAG <span class="tag">${count} / 16</span></h2><p class="note">Exakt 16 måste vara aktiva för att skapa en turnering. Du kan ändra deltagare mellan turneringar. Avaktiverade lag finns kvar i ranking och historik.</p>${ordered.map(x=>`<label class="ination"><span><input type="checkbox" ${x.n.active?'checked':''} onchange="toggleNation('${x.n.id}',this.checked)"> ${nation(x.n.id)}</span><small>${x.pts} p · ursprung ${x.n.original}</small></label>`).join('')}<p class="note">${count===16?'✓ Exakt 16 aktiva nationer':'Välj exakt 16 nationer innan turneringsstart.'}</p></section><section class="panel"><h2>LÄGG TILL LANDSLAG</h2><p class="note">Välj land och flagga. Nya landslag får ett permanent ursprungsnummer och startar inaktiva.</p><select id="newNation" class="ifield"><option value="">Välj land...</option>${FLAG_OPTIONS.filter(x=>!intl.nations.some(n=>n.code===x[1])).map(x=>`<option value="${x[1]}">${flag(x[1])} ${esc(x[0])}</option>`).join('')}</select><button class="btn secondary" onclick="addNation()">Lägg till landslag</button></section>${!finished().length&&!intl.tournaments.length?`<section class="panel"><h2>FÖRSTA SEEDNINGEN</h2><p class="note">Flytta aktiva lag med pilarna. Alla har 0 poäng tills första turneringen är färdig.</p>${intl.nations.filter(n=>n.active).sort((a,b)=>a.original-b.original).map((n,i,arr)=>`<div class="ination"><span><b class="gold">${i+1}.</b> ${nation(n.id)}</span><span><button class="ismall" ${i===0?'disabled':''} onclick="moveSeed('${n.id}',-1)">↑</button> <button class="ismall" ${i===arr.length-1?'disabled':''} onclick="moveSeed('${n.id}',1)">↓</button></span></div>`).join('')}</section>`:''}</main>`}
function toggleNation(id,on){if(ongoing()){alert('Deltagarlistan är låst under pågående turnering.');render();return}ni(id).active=on;saveI();render()}
function addNation(){let code=$('#newNation').value,entry=FLAG_OPTIONS.find(x=>x[1]===code);if(!entry)return alert('Välj ett land.');if(intl.nations.some(n=>n.code===code))return;intl.nations.push({id:newId(),name:entry[0],code,active:false,original:Math.max(0,...intl.nations.map(n=>n.original))+1});saveI();render();toast('Landslaget tillagt')}
function moveSeed(id,dir){if(intl.tournaments.length)return;let active=intl.nations.filter(n=>n.active).sort((a,b)=>a.original-b.original),idx=active.findIndex(n=>n.id===id),other=active[idx+dir];if(!other)return;let n=ni(id),tmp=n.original;n.original=other.original;other.original=tmp;saveI();render()}
function iNew(){let r=activeRank(),t=ongoing();return `${iHead('NY TURNERING')}<main class="wrap"><section class="panel"><h2>SKAPA TURNERING</h2>${t?'<p class="note">Det finns redan en pågående turnering.</p>':`<label>År</label><input id="iYear" class="ifield" type="number" min="2020" max="2200" value="${nextYear()}"><label>Turneringens namn</label><input id="iName" class="ifield" value="World Championship"><p class="note">De 16 aktiva nationerna seedas efter världsrankingen. Startordningen kan justeras i landslagsregistret före första turneringen.</p><h3>SEEDNING</h3>${r.map((x,i)=>`<div class="ination"><span>${i+1}. ${nation(x.n.id)}</span><small>${x.pts} p</small></div>`).join('')}<p class="note">Slutspelsträdet använder preliminärt 1–16, 8–9, 4–13, 5–12, 2–15, 7–10, 3–14, 6–11. Kontrollera mot NHL 27 innan du börjar spela.</p><button class="btn primary wide" ${r.length===16?'':'disabled'} onclick="createTournament()">Skapa turnering</button>`}</section></main>`}
function createTournament(){if(ongoing())return;let active=activeRank();if(active.length!==16)return alert('Exakt 16 nationer måste vara aktiva.');let year=Number($('#iYear').value),name=$('#iName').value.trim();if(!Number.isInteger(year)||year<2020||year>2200||!name)return alert('Ange ett giltigt år och turneringsnamn.');if(intl.tournaments.some(t=>t.year===year))return alert('Det finns redan en turnering med det året.');if(!confirm('Skapa turneringen med denna seedning? Deltagare och seedning låses för turneringen.'))return;let ids=active.map(x=>x.n.id);let matches=intl.bracketPattern.map(([a,b])=>({a:ids[a-1],b:ids[b-1],winner:null,score:null}));for(let i=0;i<7;i++)matches.push({a:null,b:null,winner:null,score:null});let t={id:newId(),year,name,seed:ids,matches,complete:false,created:Date.now()};intl.tournaments.push(t);saveI();openTournament(t.id);toast('Turneringen skapad!')}
function getTournament(){return intl.tournaments.find(t=>t.id===iViewId)}
function matchRound(index){return index<8?0:index<12?1:index<14?2:3}
function roundStart(r){return [0,8,12,14][r]}
function roundSize(r){return [8,4,2,1][r]}
function currentRound(t){for(let r=0;r<4;r++)if(t.matches.slice(roundStart(r),roundStart(r)+roundSize(r)).some(m=>!m.winner))return r;return 3}
function openTournament(id){let t=intl.tournaments.find(x=>x.id===id);if(!t)return;iViewId=id;iRound=t.complete?3:currentRound(t);iEditing=null;go('itournament')}
function h2h(t,m){if(!m.a||!m.b)return '–';let a=0,b=0;for(let tr of intl.tournaments){for(let x of tr.matches){if(tr.id===t.id&&x===m)break;if(x.winner&&(x.a===m.a&&x.b===m.b||x.a===m.b&&x.b===m.a)){if(x.winner===m.a)a++;else b++}}if(tr.id===t.id)break}return `${a}–${b}`}
let iDraftWinner=null,iDraftScore='2–0';
function editMatch(idx){let t=getTournament(),m=t?.matches[idx];if(!t||t.complete||!m?.a||!m?.b)return;if(iEditing===idx){iEditing=null}else{iEditing=idx;iDraftWinner=m.winner||null;iDraftScore=m.score||'2–0'}render()}
function chooseWinner(id){iDraftWinner=id;render()}
function chooseScore(score){iDraftScore=score;render()}
function scoreLabel(m){if(!m.winner)return '';let loss=iDraftScore==='2–1'?'1':'0';return iDraftWinner===m.a?'2–'+loss:loss+'–2'}
function iTournament(){let t=getTournament();if(!t)return international();let labels=['Åttondel','Kvartsfinal','Semifinal','Final'],ms=t.matches.slice(roundStart(iRound),roundStart(iRound)+roundSize(iRound));return `${iHead(esc(t.name)+' '+esc(t.year))}<main class="wrap"><section class="panel"><div class="row"><h2>${esc(t.name)} ${esc(t.year)}</h2><span class="tag">${t.complete?'Avslutad':'Pågår'}</span></div><p class="note">${t.complete?'Historiskt slutspel · skrivskyddat':'Välj vinnare och resultat direkt i respektive serie.'}</p><div class="irounds">${labels.map((l,r)=>`<button class="${iRound===r?'active':''}" onclick="iRound=${r};iEditing=null;render()">${l}</button>`).join('')}</div>${ms.map((m,i)=>{let idx=roundStart(iRound)+i,editable=!t.complete&&m.a&&m.b,open=iEditing===idx&&editable;return `<div class="imatch ${open?'chosen':''}"><div class="imatchtop"><b>SERIE ${i+1}</b><small>Inbördes möten: ${h2h(t,m)}</small></div>${open?`<div class="i-team-picks">${[m.a,m.b].map(id=>`<button type="button" class="i-team-pick ${iDraftWinner===id?'selected':''}" onclick="chooseWinner('${id}')">${nation(id)}${iDraftWinner===id?' <span class="i-tick">✓</span>':''}</button>`).join('')}</div><div class="i-score-row"><span>Serieresultat</span><div class="i-score-options">${['2–0','2–1'].map(sc=>`<button type="button" class="${iDraftScore===sc?'selected':''}" onclick="chooseScore('${sc}')">${iDraftWinner===m.b?(sc==='2–0'?'0–2':'1–2'):sc}</button>`).join('')}</div></div><button type="button" class="btn primary i-save" ${!iDraftWinner?'disabled':''} onclick="saveResult(${idx})">Spara resultat</button>${m.winner?'<p class="note">Ändrad vinnare kan påverka senare omgångar.</p>':''}<button type="button" class="i-cancel" onclick="editMatch(${idx})">Avbryt</button>`:`<div class="imatchteams"><span>${nation(m.a)}</span><span class="muted">mot</span><span>${nation(m.b)}</span></div><div class="i-match-foot"><span class="imatchbottom">${m.winner?`✓ ${nation(m.winner)} vann ${m.winner===m.a?m.score:(m.score==='2–0'?'0–2':'1–2')}`:m.a&&m.b?'Inväntar resultat':'Inväntar vinnare från föregående omgång'}</span>${editable?`<button type="button" class="i-edit" onclick="editMatch(${idx})">${m.winner?'Ändra':'Registrera'} ›</button>`:''}</div>`}</div>`}).join('')}</section>${iRound===3&&t.complete?`<section class="panel"><h2>🏆 MÄSTARE</h2><h2>${nation(t.matches[14].winner)}</h2><p>Silver: ${nation(t.matches[14].a===t.matches[14].winner?t.matches[14].b:t.matches[14].a)}</p><p>Delat brons: ${t.matches.slice(12,14).map(x=>nation(x.a===x.winner?x.b:x.a)).join(' · ')}</p></section>`:''}<p class="note">Samma slutspelsträd och resultat bevaras i historiken.</p></main>`}
function rebuildProgress(t){let m=t.matches;for(let r=1;r<4;r++){let prev=roundStart(r-1),start=roundStart(r),count=roundSize(r);for(let i=0;i<count;i++){let a=m[prev+2*i].winner,b=m[prev+2*i+1].winner,match=m[start+i];if(match.a!==a||match.b!==b){match.a=a||null;match.b=b||null;match.winner=null;match.score=null}}}t.complete=!!m[14].winner}
function saveResult(idx){let t=getTournament();if(!t||t.complete)return;let m=t.matches[idx];if(!m||!m.a||!m.b||![m.a,m.b].includes(iDraftWinner)||!['2–0','2–1'].includes(iDraftScore))return;let changed=m.winner&&m.winner!==iDraftWinner;if(changed&&!confirm('Ändrad vinnare kan rensa resultat i senare omgångar. Fortsätta?'))return;m.winner=iDraftWinner;m.score=iDraftScore;rebuildProgress(t);saveI();iEditing=null;iDraftWinner=null;iRound=currentRound(t);render();toast(t.complete?'Turneringen avslutad!':'Resultatet sparat!')}

function render(){document.title='Franchise Archives';$('#app').innerHTML=({home,nhl,form,records,career,history,cups,settings,international,iranking:iRanking,imedals:iMedals,ifinals:iFinals,inations:iNations,inew:iNew,itournament:iTournament}[screen]||home)()};render();
persist();</script></body></html>
