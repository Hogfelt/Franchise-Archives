(', '):'Inga titlar'}</div><div class="value">${max||'–'}</div></div></div></section><section class="panel" onclick="go('career')" style="cursor:pointer"><div class="row"><h3>HÖGFELTS KARRIÄR</h3><b>❯</b></div><div class="grid">${[['Mål',h.g],['Assist',h.a],['Poäng',h.p]].map(x=>`<div class="record"><div class="value">${x[1]}</div><small>${x[0]}</small></div>`).join('')}</div></section><button class="btn" style="width:100%" onclick="editing=null;go('form')">＋ Registrera ny säsong</button></main>`}function totals(){return seasons.reduce((a,s)=>{for(let k of ['gp','g','a'])a[k]+=Number(s.h[k])||0;a.p=a.g+a.a;return a},{gp:0,g:0,a:0,p:0})}function form(){let s=editing!==null?seasons[editing]:null;let rows=(cat)=>`<section class="section"><h3>TOPP 3 – ${{goals:'MÅL',assists:'ASSIST',points:'POÄNG'}[cat]}</h3>${[0,1,2].map(i=>`<div class="formrow"><span>${i+1}.</span><input name="${cat}_${i}_name" list="players" placeholder="Spelare" value="${esc(s?.[cat]?.[i]?.name||'')}"><input name="${cat}_${i}_value" type="number" min="0" placeholder="Antal" value="${esc(s?.[cat]?.[i]?.value??'')}"></div>`).join('')}</section>`;let names=[...new Set(seasons.flatMap(x=>['goals','assists','points'].flatMap(k=>x[k].map(y=>y.name))))].filter(Boolean);return `${head(editing===null?'Ny säsong':'Redigera säsong')}<main class="wrap"><form id="seasonForm" onsubmit="saveSeason(event)"><div class="panel"><label>Säsong</label><input name="year" required pattern="[0-9]{4}/[0-9]{2}" placeholder="2026/27" value="${esc(s?.year||nextSeason())}"><p class="note">Föreslås automatiskt efter senaste registrerade säsongen.</p></div><datalist id="players">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>${['goals','assists','points'].map(rows).join('<hr class="line">')}<hr class="line"><section class="section"><h3>MARKUS HÖGFELT · GRUNDSERIEN</h3><div class="fieldgrid">${[['gp','Matcher'],['g','Mål'],['a','Assist']].map(([k,l])=>`<div><label>${l}</label><input type="number" min="0" name="h_${k}" value="${esc(s?.h?.[k]??'0')}" oninput="calcPoints()"></div>`).join('')}</div><p class="muted">Poäng: <b id="hpoints">${s?Number(s.h.g)+Number(s.h.a):0}</b> (räknas automatiskt)</p></section><hr class="line"><section class="section"><h3>STANLEY CUP-FINALEN</h3><label>Mästare</label><input name="champ" required placeholder="Vinnande lag" value="${esc(s?.champ||'')}"><label>Finalist</label><input name="runner" required placeholder="Förlorande lag" value="${esc(s?.runner||'')}"><label>Finalseriens resultat (från mästarens perspektiv)</label><div class="grid two"><input value="4" disabled aria-label="Mästarens segrar"><select name="losses">${[0,1,2,3].map(n=>`<option value="${n}" ${Number(s?.losses)===n?'selected':''}>4–${n}</option>`).join('')}</select></div></section><hr class="line"><section class="section"><h3>NEW YORK RANGERS</h3><label>Slutspelsresultat</label><select name="playoffs">${[['miss','Missade slutspel'],['r1','Utslagna i första rundan'],['r2','Utslagna i andra rundan'],['cf','Utslagna i konferensfinal'],['final','Förlorade Stanley Cup-finalen'],['cup','Stanley Cup-mästare']].map(([v,l])=>`<option value="${v}" ${s?.playoffs===v?'selected':''}>${l}</option>`).join('')}</select></section><hr class="line"><section class="section"><h3>SÄSONGENS MINNE</h3><textarea name="memory" placeholder="Ett minne från säsongen (frivilligt)">${esc(s?.memory||'')}</textarea></section><button class="btn" style="width:100%" type="submit">${editing===null?'Slutför säsong':'Spara ändringar'}</button><p class="note">Testversion: sparas på den här enheten. Molnlagring ansluts senare.</p></form></main>`}function calcPoints(){let f=$('#seasonForm');$('#hpoints').textContent=(+f.elements.h_g.value||0)+(+f.elements.h_a.value||0)}function saveSeason(e){e.preventDefault();if(readonly())return;let f=e.target,d=new FormData(f),year=String(d.get('year')).trim();if(!/^\d{4}\/\d{2}$/.test(year)||Number(year.slice(-2))!==(Number(year.slice(0,4))+1)%100){alert('Ange en giltig säsong, t.ex. 2026/27.');return}if(seasons.some((s,i)=>s.year===year&&i!==editing)){alert('Säsongen finns redan. Redigera den i säsongsarkivet.');return}let obj={year,h:{gp:+d.get('h_gp'),g:+d.get('h_g'),a:+d.get('h_a')},champ:String(d.get('champ')).trim(),runner:String(d.get('runner')).trim(),losses:+d.get('losses'),playoffs:d.get('playoffs'),memory:d.get('memory')};for(let cat of ['goals','assists','points']){obj[cat]=[0,1,2].map(i=>({name:String(d.get(`${cat}_${i}_name`)).trim(),value:d.get(`${cat}_${i}_value`)===''?'':+d.get(`${cat}_${i}_value`)}));if(obj[cat].some(x=>!x.name||x.value===''||x.value<0)){alert('Fyll i samtliga tre spelare och resultat för mål, assist och poäng.');return}if(obj[cat].some((x,i,a)=>i>0&&x.value>a[i-1].value)){alert('Topplistorna måste vara sorterade från högst till lägst.');return}}if(obj.champ.toLowerCase()===obj.runner.toLowerCase()){alert('Mästare och finalist måste vara olika lag.');return}if(editing===null)seasons.push(obj);else seasons[editing]=obj;seasons.sort((a,b)=>a.year.localeCompare(b.year));persist();editing=null;go('nhl');toast('Säsongen sparad!')}function records(){let cats=[['goals','Mål'],['assists','Assist'],['points','Poäng']];return `${head('REKORDBOKEN')}<main class="wrap">${nav()}${cats.map(([cat,label])=>`<section class="panel"><h2>TOPP 10 – ${label.toUpperCase()}</h2>${table(['#','Spelare',label,'Säsong'],topRecords(cat).slice(0,10).map((x,i)=>[i+1,x.name,x.value,x.year]))}</section>`).join('')}<section class="panel"><h2>FLEST LIGATITLAR</h2><p class="note">Ettan i varje säsongs topplista tilldelas titeln.</p>${cats.map(([cat,label])=>{let m={};seasons.forEach(s=>{let n=s[cat][0]?.name;if(n)m[n]=(m[n]||0)+1});return `<h3>${label}</h3>${table(['Spelare','Titlar'],Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([n,v])=>[n,v]))}`}).join('')}</section></main>`}function table(headers,rows){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ingen statistik registrerad ännu.</div>'}function career(){let t=totals();let ordered=[...seasons].sort((a,b)=>a.year.localeCompare(b.year));return `${head('HÖGFELTS KARRIÄR')}<main class="wrap">${nav()}<section class="panel"><h2>MARKUS HÖGFELT</h2><small>NEW YORK RANGERS · GRUNDSERIEN</small><div class="grid" style="margin-top:12px">${[['Matcher',t.gp],['Mål',t.g],['Assist',t.a]].map(([l,v])=>`<div class="record"><div class="value">${v}</div><small>${l}</small></div>`).join('')}</div><div class="record" style="margin-top:9px"><small>TOTALA KARRIÄRPOÄNG</small><div class="value gold">${t.p}</div></div></section><section class="panel"><h2>SÄSONG FÖR SÄSONG</h2>${table(['Säsong','GP','G','A','P'],[...ordered.map(s=>[s.year,s.h.gp,s.h.g,s.h.a,s.h.g+s.h.a]),...(ordered.length?[['TOTALT',t.gp,t.g,t.a,t.p]]:[])])}</section><section class="panel"><h2>PERSONLIGA SÄSONGSREKORD</h2>${table(['Kategori','Antal','Säsong'],[['Mål','g'],['Assist','a'],['Poäng','p']].map(([l,k])=>{let v=ordered.map(s=>({year:s.year,n:k==='p'?s.h.g+s.h.a:s.h[k]})).sort((a,b)=>b.n-a.n)[0];return[l,v?.n??'–',v?.year??'–']}))}</section></main>`}function history(){return `${head('SÄSONGSARKIV')}<main class="wrap">${nav()}${[...seasons].sort((a,b)=>b.year.localeCompare(a.year)).map(s=>{let i=seasons.indexOf(s);return `<div class="panel"><div class="row"><h2>${esc(s.year)}</h2>${current().archived?'':`<button class="btn secondary" onclick="editing=${i};go('form')">Redigera</button>`}</div><p>🏆 ${esc(s.champ)} – ${esc(s.runner)} (4–${s.losses})</p><p>Högfelt: ${s.h.gp} GP · ${s.h.g} G · ${s.h.a} A · <b>${s.h.g+s.h.a} P</b></p><p>Rangers: ${esc(playoffName(s.playoffs))}</p>${s.memory?`<p class="note">”${esc(s.memory)}”</p>`:''}${current().archived?'':`<button class="btn danger" onclick="deleteSeason(${i})">Radera säsong</button>`}</div>`}).join('')||'<div class="empty">Inga säsonger ännu.</div>'}</main>`}function playoffName(p){return ({miss:'Missade slutspel',r1:'Första rundan',r2:'Andra rundan',cf:'Konferensfinal',final:'Stanley Cup-final',cup:'Stanley Cup-mästare'})[p]||'–'}function deleteSeason(i){if(readonly())return;if(confirm(`Radera säsongen ${seasons[i].year}? Detta kan inte ångras.`)){seasons.splice(i,1);persist();go('history');toast('Säsongen raderad')}}function cups(){let counts=championCounts();return `${head('STANLEY CUP')}<main class="wrap">${nav()}<section class="panel"><h2>FLEST STANLEY CUP-TITLAR</h2>${table(['Lag','Titlar'],counts)}</section><section class="panel"><h2>FINALHISTORIK</h2>${table(['Säsong','Mästare','Finalist','Resultat'],[...seasons].sort((a,b)=>b.year.localeCompare(a.year)).map(s=>[s.year,s.champ,s.runner,`4–${s.losses}`]))}</section></main>`}function settings(){return `${head('INSTÄLLNINGAR')}<main class="wrap">${nav()}<section class="panel"><h2>FRANCHISE-HANTERING</h2><p class="note">Aktiv: ${esc(current().name)} · ${esc(current().start)} · ${current().games} matcher/säsong${current().archived?' · Arkiverad':''}</p><div class="btnrow"><button class="btn secondary" onclick="createFranchise()">Skapa ny Franchise</button><button class="btn secondary" onclick="archiveFranchise()">Arkivera nuvarande</button></div><h3>Sparade karriärer</h3>${store.franchises.map(f=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #33465e;gap:12px"><div><b>${esc(f.name)}</b><p class="note" style="margin:3px 0">${esc(f.start)} · ${f.games} matcher · ${f.seasons.length} säsonger · ${f.archived?'Arkiverad':'Aktiv karriär'}</p></div><button class="btn secondary" onclick="switchFranchise('${f.id}')">${f.id===store.active?'Visas':'Öppna'}</button></div>`).join('')}</section><section class="panel"><h2>DATAHANTERING</h2><p class="note">v0.2.0 är ett testläge. Data sparas bara i den här webbläsaren tills Supabase kopplas in. Exportera regelbundet en backup.</p><div class="btnrow"><button class="btn secondary" onclick="exportData()">Exportera backup</button><button class="btn secondary" onclick="$('#importFile').click()">Importera backup</button></div><input id="importFile" type="file" accept="application/json,.json" class="hide" onchange="importData(event)"><hr class="line"><button class="btn secondary" onclick="demoData()">Lägg in testdata</button><p class="note">Lägger till tre fiktiva säsonger. Befintlig data påverkas inte.</p><hr class="line"><button class="btn danger" onclick="clearData()">Radera all NHL-data</button><p class="note">Tar bort alla registrerade säsonger från den här enheten.</p></section></main>`}function exportData(){let blob=new Blob([JSON.stringify({app:'franchise-archives',version:2,store},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='franchise-archives-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!=='franchise-archives')throw Error();let incoming;if(d.version===2&&d.store&&Array.isArray(d.store.franchises)&&d.store.franchises.length){incoming=d.store}else if(Array.isArray(d.seasons)){incoming={active:null,franchises:[{id:newId(),name:'Importerad Franchise',start:'2026/27',games:46,archived:false,seasons:d.seasons}]};incoming.active=incoming.franchises[0].id}else throw Error();if(!confirm('Ersätta ALLA befintliga Franchise-karriärer med innehållet i backupfilen?'))return;store=incoming;if(!store.franchises.some(x=>x.id===store.active))store.active=store.franchises[0].id;syncFranchise();persist();go('nhl');toast('Backup importerad')}catch{alert('Filen är inte en giltig Franchise Archives-backup.')}}
function archiveFranchise(){let f=current();if(f.archived)return toast('Redan arkiverad');if(!confirm('Arkivera '+f.name+'? Historiken sparas och blir skrivskyddad. Du kan öppna den senare.'))return;f.archived=true;persist();go('settings');toast('Franchise arkiverad')}
function createFranchise(){let name=prompt('Namn på ny Franchise (t.ex. Detroit Red Wings):');if(!name||!name.trim())return;let start=prompt('Startsäsong (t.ex. 2026/27):','2026/27');if(!start||!/^\d{4}\/\d{2}$/.test(start)||Number(start.slice(-2))!==(Number(start.slice(0,4))+1)%100){alert('Ogiltig startsäsong');return}let games=Number(prompt('Matcher per grundserie (t.ex. 46 eller 82):','82'));if(!Number.isInteger(games)||games<1||games>100){alert('Ange ett giltigt antal matcher (1–100)');return}if(!confirm('Skapa en ny tom Franchise? Den nuvarande sparas oförändrad.'))return;let f={id:newId(),name:name.trim(),start,games,archived:false,seasons:[]};store.franchises.push(f);store.active=f.id;syncFranchise();persist();editing=null;go('nhl');toast('Ny Franchise skapad')}
function switchFranchise(id){let f=store.franchises.find(x=>x.id===id);if(!f)return;store.active=id;syncFranchise();editing=null;persist();go('nhl');toast(f.archived?'Arkiverad Franchise öppnad (skrivskyddad)':'Franchise öppnad')}
function clearData(){if(readonly())return;if(confirm('Radera ALL NHL-data på den här enheten?')&&confirm('Är du helt säker? Exportera gärna en backup först.')){seasons=[];persist();go('nhl');toast('NHL-data raderad')}}function demoData(){if(readonly())return;let names=['Florida Panthers','Edmonton Oilers','New York Rangers'];let samples=[2026,2027,2028].filter(y=>!seasons.some(s=>s.year.startsWith(String(y)))).map((y,i)=>({year:`${y}/${String((y+1)%100).padStart(2,'0')}`,goals:[{name:'David Pastrňák',value:42+i*2},{name:'Macklin Celebrini',value:39+i},{name:'Auston Matthews',value:36+i}],assists:[{name:'Martin Nečas',value:45+i*3},{name:'Connor McDavid',value:43+i},{name:'Macklin Celebrini',value:41+i}],points:[{name:'Macklin Celebrini',value:63+i*8},{name:'David Pastrňák',value:62+i*4},{name:'Aleksander Barkov',value:60+i*2}],h:{gp:46,g:15+i*6,a:10+i*9},champ:names[i],runner:names[(i+1)%3],losses:i+1,playoffs:['r1','r2','cup'][i],memory:'Fiktiv testsäsong'}));if(!samples.length)return toast('Testsäsongerna finns redan');seasons.push(...samples);seasons.sort((a,b)=>a.year.localeCompare(b.year));persist();go('nhl');toast('Testdata tillagd')}function render(){document.title='Franchise Archives';$('#app').innerHTML=({home,nhl,form,records,career,history,cups,settings}[screen]||home)()};render();
persist();</script></body></html>
